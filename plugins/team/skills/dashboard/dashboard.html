<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f9fafb; --text: #0f172a; --text-2: #475569; --text-3: #94a3b8;
  --line: #e5e7eb; --line-2: #eef0f3; --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 1px 1px rgba(15, 23, 42, .03);
  --accent: #2563eb; --accent-soft: #eff4ff; --ok: #059669; --ok-soft: #ecfdf5; --bad: #dc2626; --bad-soft: #fef2f2;
  --warn: #b45309; --warn-soft: #fffbeb;
  --r-pm: #7c3aed; --r-rs: #0d9488; --r-pj: #d97706; --r-dl: #2563eb; --r-qa: #e11d48; --r-rw: #475569; --r-am: #64748b; --r-rv: #0891b2; --r-se: #b45309; --r-sm: #db2777; --r-ds: #9333ea;
  --r-x1: #0891b2; --r-x2: #c026d3; --r-x3: #65a30d; --r-x4: #ea580c; --r-x5: #4f46e5;
  --k-read: #64748b; --k-edit: #2563eb; --k-run: #7c3aed; --k-search: #0d9488; --k-web: #d97706; --k-tracker: #db2777; --k-tool: #94a3b8;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0d12; --surface: #12151c; --surface-2: #161a22; --text: #e8ebf1; --text-2: #a3acbd; --text-3: #6b7486;
    --line: #232834; --line-2: #1b1f29; --shadow: none;
    --accent: #6d9bff; --accent-soft: #172341; --ok: #34d399; --ok-soft: #0f2a21; --bad: #f87171; --bad-soft: #2c1517;
    --warn: #fbbf24; --warn-soft: #2b2110;
    --r-pm: #a78bfa; --r-rs: #2dd4bf; --r-pj: #fbbf24; --r-dl: #6d9bff; --r-qa: #fb7185; --r-rw: #94a3b8; --r-am: #8a94a6; --r-rv: #22d3ee; --r-se: #f59e0b; --r-sm: #f472b6; --r-ds: #c084fc;
    --r-x1: #22d3ee; --r-x2: #e879f9; --r-x3: #a3e635; --r-x4: #fb923c; --r-x5: #818cf8;
    --k-read: #94a3b8; --k-edit: #6d9bff; --k-run: #a78bfa; --k-search: #2dd4bf; --k-web: #fbbf24; --k-tracker: #f472b6; --k-tool: #6b7486;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable", "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Sans", sans-serif;
  -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01", "tnum";
}
/* Right-to-left (Arabic, Hebrew, Persian, Urdu): a font with the script first, room for
   diacritics, and no tracking — letter-spacing breaks the joins of connected scripts. */
:root[dir="rtl"] body {
  font-family: "SF Arabic", "Geeza Pro", "Noto Sans Arabic", "Segoe UI", Tahoma, "Noto Sans Hebrew", system-ui, sans-serif;
  line-height: 1.65; font-feature-settings: "tnum";
}
:root[dir="rtl"] *, :root[dir="rtl"] *::before, :root[dir="rtl"] *::after { letter-spacing: normal !important; font-style: normal; }
:root[dir="rtl"] .title b, :root[dir="rtl"] .section-head h2 { line-height: 1.4; }
:root[dir="rtl"] .tl-label { direction: rtl; }
:root[dir="rtl"] .flow { direction: rtl; }
/* Mixed text (English labels, ticket ids, times inside Arabic): each piece takes its direction
   from its own first letter, so "30 min" or "RB-7" never flip to "min 30" or "7-RB". */
:root[dir="rtl"] :is(button, a, b, i, span, small, label, td, th, li, p, h2, h3, h4, summary, option) { unicode-bidi: plaintext; }
:root[dir="rtl"] code, :root[dir="rtl"] pre, :root[dir="rtl"] .file span { direction: ltr; unicode-bidi: isolate; }
bdi, .ltr { unicode-bidi: isolate; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 56px; }
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin-bottom: 24px; }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-top: 14px; padding-bottom: 14px; }
.logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent); }
.logo svg { width: 17px; height: 17px; }
.title { display: flex; flex-direction: column; min-width: 0; }
.title b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title span { font-size: 12px; color: var(--text-3); }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 600; color: var(--text-2); white-space: nowrap; }
.pill .led { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.pill.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, var(--line)); background: var(--ok-soft); }
.pill.on .led { background: var(--ok); animation: ping 1.8s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 80%, 100% { box-shadow: 0 0 0 7px transparent; } }
.muted { color: var(--text-3); font-size: 12px; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 13px; font-weight: 500; margin-bottom: 20px; border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 28px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi .label { font-size: 12px; color: var(--text-2); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.kpi .label svg { width: 14px; height: 14px; color: var(--text-3); }
.kpi .value { font-size: 28px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; }
.kpi .value small { font-size: 15px; color: var(--text-3); font-weight: 500; margin-inline-start: 4px; }
.kpi .sub { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 3px; background: var(--ok); transition: width .6s ease; }

.section { margin-bottom: 28px; }
.section-head { display: flex; align-items: baseline; gap: 10px; margin: 0 2px 12px; }
.section-head h2 { font-size: 13px; font-weight: 650; margin: 0; letter-spacing: -.005em; }
.section-head .count { font-size: 12px; color: var(--text-3); font-weight: 500; }

.avatar { width: 38px; height: 38px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 700; letter-spacing: .02em; color: var(--role); background: color-mix(in srgb, var(--role) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--role) 22%, transparent); }
.agent-name { font-weight: 650; font-size: 14px; }
.agent-role { font-weight: 500; color: var(--text-3); font-size: 13px; }
.agent-meta { font-size: 12px; color: var(--text-3); display: flex; gap: 8px; align-items: center; }
.state { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--ok); }
.state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: ping 1.8s ease-out infinite; }
.state.off { color: var(--text-3); }
.state.off::before { animation: none; }
.timer { margin-inline-start: auto; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; color: var(--text-2); }
.task { font-size: 13px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 12px; }
.task b { display: block; font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
.doing { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 550; min-width: 0; }
.doing .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; color: var(--k); background: color-mix(in srgb, var(--k) 12%, var(--surface)); }
.doing .ico svg { width: 15px; height: 15px; }
.doing span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--text-2); font-variant-numeric: tabular-nums; }
.chip i { width: 7px; height: 7px; border-radius: 2px; background: var(--k); }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--line); padding-top: 12px; }
.feed li { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; font-size: 12px; color: var(--text-2); min-width: 0; }
.feed li svg { width: 13px; height: 13px; color: var(--k); }
.feed li span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed time { color: var(--text-3); font-variant-numeric: tabular-nums; }

.timeline { padding: 18px 18px 14px; }
.tl { direction: ltr; display: grid; grid-template-columns: 150px 1fr; row-gap: 10px; align-items: center; }
.tl-label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text-2); min-width: 0; }
.tl-label i { width: 8px; height: 8px; border-radius: 50%; background: var(--role); flex: none; }
.tl-label span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-track { position: relative; height: 22px; border-radius: 6px; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 6 - 1px), var(--line-2) calc(100% / 6 - 1px), var(--line-2) calc(100% / 6)); background-color: var(--surface-2); }
.tl-bar { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; background: color-mix(in srgb, var(--role) 22%, transparent); border: 1px solid color-mix(in srgb, var(--role) 45%, transparent); min-width: 4px; }
.tl-bar.running { background: color-mix(in srgb, var(--role) 32%, transparent); border-color: var(--role); }
.tl-dot { position: absolute; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: var(--k); }
.tl-now { position: absolute; top: -4px; bottom: -4px; right: 0; width: 2px; background: var(--ok); border-radius: 1px; }
.tl-axis { grid-column: 2; display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; padding-top: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-2); font-size: 12px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--k); }

.board { padding: 0; overflow: hidden; }
.grp-h { display: flex; align-items: center; gap: 8px; padding: 10px 18px; background: var(--surface-2); border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
.board > .grp-h:first-child { border-top: 0; }
.grp-h i { font-style: normal; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--line); color: var(--text-2); display: inline-grid; place-items: center; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.ticket { padding: 18px; }
.ticket + .ticket { border-top: 1px solid var(--line-2); }
.brows { list-style: none; margin: 0; padding: 0; }
.brows li { display: grid; grid-template-columns: 26px auto minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 11px 18px; border-top: 1px solid var(--line-2); }
.brows li:first-child { border-top: 0; }
.brows li:first-child .todo-n:not(.plan-n) { background: var(--accent); color: #fff; }
.tickets-tools { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
.brows-empty { padding: 14px 18px; font-size: 13px; color: var(--text-3); }
.brows li:hover { background: var(--surface-2); }
.plan-n { background: transparent; border: 1px dashed var(--line); }
.next-pill.status-next { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--accent-soft); }
.next-pill.status-busy { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); background: var(--ok-soft); }
.ticket-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; min-width: 0; }
.tid { font: 600 11px/1 ui-monospace, SFMono-Regular, Consolas, monospace; padding: 4px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); flex: none; }
.ttitle { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tpr { margin-inline-start: auto; font-size: 12px; font-weight: 600; color: var(--text-2); flex: none; }
.stepper { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.st { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; text-align: center; min-width: 0; }
.st::before { content: ""; position: absolute; top: 12px; inset-inline-start: calc(-50% + 16px); inset-inline-end: calc(50% + 16px); height: 2px; background: var(--line); }
.st:first-child::before { display: none; }
.st.done::before, .st.current::before, .st.fail::before { background: var(--ok); }
.node { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); background: var(--surface); color: var(--text-3); position: relative; z-index: 1; }
.node svg { width: 13px; height: 13px; }
.st.done .node { background: var(--ok); border-color: var(--ok); color: #fff; }
.st.current .node { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.st.current .node::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.st.fail .node { background: var(--bad); border-color: var(--bad); color: #fff; }
.st-name { font-size: 12px; font-weight: 600; color: var(--text-2); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st.todo .st-name { color: var(--text-3); font-weight: 500; }
.st.current .st-name { color: var(--accent); }
.st.fail .st-name { color: var(--bad); }
.st-sub { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; margin-top: -4px; }
.wait { margin-top: 18px; display: flex; gap: 10px; align-items: center; font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--text-2); }
.wait svg { width: 15px; height: 15px; color: var(--warn); flex: none; }
.wait b { color: var(--text); font-weight: 600; }

.none { padding: 22px; color: var(--text-3); font-size: 13px; text-align: center; }
footer { margin-top: 36px; display: flex; justify-content: center; gap: 8px; color: var(--text-3); font-size: 12px; }

@media (prefers-reduced-motion: reduce) { .pill.on .led, .state::before { animation: none; } .meter > i { transition: none; } }
@media (max-width: 920px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) {
  .wrap { padding-left: 16px; padding-right: 16px; }
  .kpis { gap: 10px; } .kpi { padding: 14px; } .kpi .value { font-size: 24px; }
  .tl { grid-template-columns: 96px 1fr; }
  .stepper { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 16px; }
  .st:nth-child(4)::before { display: none; }
  .top .muted { display: none; }
}
.tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--line-2); border: 1px solid var(--line); }
.tab { appearance: none; border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 13px; font-weight: 600; height: 28px; padding: 0 14px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(15, 23, 42, .08); }
.tab:focus-visible, .search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--line); color: var(--text-2); font-size: 11px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.toolbar { display: flex; align-items: center; gap: 12px; margin: 0 2px 12px; flex-wrap: wrap; }
.toolbar h2 { font-size: 13px; font-weight: 650; margin: 0; }
.search { margin-inline-start: auto; position: relative; }
.search svg { position: absolute; top: 50%; inset-inline-start: 10px; width: 14px; height: 14px; margin-top: -7px; color: var(--text-3); pointer-events: none; }
.search input { height: 34px; width: 260px; max-width: 100%; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; padding-inline: 32px 12px; }
.filters { display: inline-flex; gap: 6px; }
.filter { appearance: none; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
.filter[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: start; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 13px 16px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: var(--surface-2); }
.table .num { font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
.table .t-title { font-weight: 600; }
.table .t-sum { display: block; font-size: 12px; color: var(--text-3); font-weight: 400; margin-top: 2px; }
.res { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.res::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.res.merged { color: var(--ok); background: var(--ok-soft); }
.res.closed { color: var(--text-2); background: var(--line-2); }
.res.other { color: var(--warn); background: var(--warn-soft); }
.board-tools { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
.kcol { background: var(--line-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.kcol-h { display: flex; align-items: center; gap: 8px; padding: 4px 4px 6px; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
.kcol-h::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--kc, var(--text-3)); }
.kcol-h i { font-style: normal; margin-inline-start: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--surface); color: var(--text-2); display: inline-grid; place-items: center; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.kcol.plan { --kc: var(--text-3); } .kcol.do { --kc: var(--accent); } .kcol.check { --kc: var(--warn); } .kcol.done { --kc: var(--ok); }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.kcard.waiting { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.kcard-top { display: flex; align-items: center; gap: 8px; }

.flow svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; overflow: visible; pointer-events: none; }

.flow-legend { display: flex; gap: 16px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) { .fn.running .fn-box, .edge.active, .edge.aux.active, .fn.running .fn-badge::after { animation: none; } }
/* Language switch in the header: English by default, German, or the team's reply language. */
.lang { display: inline-flex; padding: 2px; gap: 2px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.lang button { appearance: none; border: 0; background: none; color: var(--text-3); font: inherit; font-size: 11.5px; font-weight: 650; height: 22px; padding: 0 9px; border-radius: 999px; cursor: pointer; }

.lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Workflow buddies: one small character per agent. Its face and moves follow the step:
   sleeping (not started), thinking (its turn, nobody running), working, waiting for you,
   happy (done), handing the work on (done and the next step is busy) and dizzy (QA failed). */
.fn .fn-box svg.buddy { width: 64px; height: 64px; overflow: visible; color: var(--role); }
.fn.aux .fn-box svg.buddy { width: 48px; height: 48px; }
.flow-body.has-panel .fn .fn-box svg.buddy { width: 54px; height: 54px; }
.flow-body.has-panel .fn.aux .fn-box svg.buddy { width: 42px; height: 42px; }
.buddy :is(.bd, .arm-l, .arm-r, .pupils, .prop, .e-open, .fx text, .fx .drop, .fx .spark, .fx .ask) { transform-box: fill-box; }
.buddy .skin { fill: var(--role); }
.buddy .skin-d { fill: color-mix(in srgb, var(--role) 62%, #0b0d12); }
.buddy .belly { fill: #fff; opacity: .2; }
.buddy .eye-w { fill: #fff; }
.buddy .ink { fill: #1d1b2b; }
.buddy .ink-s { fill: none; stroke: #1d1b2b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.buddy .glint { fill: #fff; }
.buddy .cheek { fill: #ff7aa8; opacity: .5; }
.buddy .shadow { fill: currentColor; opacity: .16; }
.buddy .tongue { fill: #ff7aa8; }
.buddy .prop-bg { fill: #fff; stroke: color-mix(in srgb, var(--role) 62%, #0b0d12); stroke-width: 1.4; }
.buddy .prop path { fill: none; stroke: color-mix(in srgb, var(--role) 70%, #0b0d12); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.buddy .hat-y { fill: #fcd34d; } .buddy .hat-g { fill: #cbd5e1; } .buddy .hat-k { fill: #1d1b2b; } .buddy .hat-p { fill: #f472b6; } .buddy .hat-w { fill: #fff; }
.buddy .bulb { fill: #fde68a; }
.buddy .fx text { font: 800 12px/1 ui-rounded, system-ui, sans-serif; fill: var(--text-2); letter-spacing: 0 !important; }
.buddy .fx .dot { fill: var(--text-3); }
.buddy .fx .bubble { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.buddy .fx .drop { fill: #7dd3fc; }
.buddy .fx .spark { fill: #fcd34d; }

/* Everything a state does not use stays hidden. */
.buddy .e-sleep, .buddy .e-happy, .buddy .e-x, .buddy .m-smile, .buddy .m-o, .buddy .m-focus, .buddy .m-sad, .buddy .m-grin,
.buddy .fx > g { display: none; }
.fn .buddy .e-open, .fn .buddy .m-smile { display: inline; }

/* sleeping */
.fn.todo .buddy .e-open, .fn.todo .buddy .m-smile { display: none; }
.fn.todo .buddy .e-sleep, .fn.todo .buddy .m-o, .fn.todo .buddy .fx .zzz { display: inline; }
.fn.todo .buddy .bd { filter: saturate(.35); opacity: .8; transform-origin: 50% 100%; animation: b-breathe 3.4s ease-in-out infinite; }
.fn.todo .buddy .fx .zzz text { fill: var(--text-2); animation: b-z 3s ease-in infinite; opacity: 0; }
.fn.todo .buddy .fx .zzz text:nth-child(2) { animation-delay: 1s; }
.fn.todo .buddy .fx .zzz text:nth-child(3) { animation-delay: 2s; }
.fn.todo .buddy .bulb { fill: #cbd5e1; }

/* working */
.fn.running .buddy .m-smile { display: none; }
.fn.running .buddy .m-focus, .fn.running .buddy .fx .sweat { display: inline; }
.fn.running .buddy .bd { transform-origin: 50% 100%; animation: b-bounce .55s ease-in-out infinite; }
.fn.running .buddy .arm-l { transform-origin: 80% 20%; animation: b-type .28s ease-in-out infinite alternate; }
.fn.running .buddy .arm-r { transform-origin: 20% 20%; animation: b-type .28s ease-in-out infinite alternate-reverse; }
.fn.running .buddy .pupils { animation: b-read 1.8s steps(1) infinite; }
.fn.running .buddy .prop { transform-origin: 50% 50%; animation: b-wiggle .55s ease-in-out infinite alternate; }
.fn.running .buddy .fx .sweat .drop { animation: b-drop 2.2s ease-in infinite; }
.fn.running .buddy .bulb { animation: b-glow 1.1s ease-in-out infinite alternate; }

/* thinking */
.fn.current .buddy .m-smile { display: none; }
.fn.current .buddy .m-o, .fn.current .buddy .fx .think { display: inline; }
.fn.current .buddy .pupils { animation: b-ponder 4s ease-in-out infinite; }
.fn.current .buddy .bd { transform-origin: 50% 100%; animation: b-tilt 4s ease-in-out infinite; }
.fn.current .buddy .arm-r { transform-origin: 20% 20%; transform: rotate(-120deg) translate(-2px, 2px); }
.fn.current .buddy .fx .think .dot { animation: b-dots 1.5s ease-in-out infinite; }
.fn.current .buddy .fx .think .dot:nth-child(2) { animation-delay: .25s; }
.fn.current .buddy .fx .think .dot:nth-child(3) { animation-delay: .5s; }
.fn.current .buddy .bulb { animation: b-glow 1.6s ease-in-out infinite alternate; }

/* waiting for you */
.fn.waiting .buddy .fx .ask { display: inline; }
.fn.waiting .buddy .m-smile { display: none; } .fn.waiting .buddy .m-grin { display: inline; }
.fn.waiting .buddy .arm-r { transform-origin: 20% 15%; animation: b-wave .45s ease-in-out infinite alternate; }
.fn.waiting .buddy .bd { transform-origin: 50% 100%; animation: b-hop 1.6s ease-in-out infinite; }
.fn.waiting .buddy .fx .ask { transform-origin: 50% 100%; animation: b-pop 1.6s ease-in-out infinite; }

/* done: happy, and passing the work on when the next step is busy */
.fn.done .buddy .e-open { display: none; } .fn.done .buddy .e-happy { display: inline; }
.fn.done .buddy .bd { transform-origin: 50% 100%; animation: b-sway 3.2s ease-in-out infinite; }
.fn.done .buddy .fx .sparks { display: inline; }
.fn.done .buddy .fx .sparks .spark { transform-origin: 50% 50%; animation: b-twinkle 2.4s ease-in-out infinite; opacity: 0; }
.fn.done .buddy .fx .sparks .spark:nth-child(2) { animation-delay: 1.2s; }
.fn.done.sharing .buddy .m-smile { display: none; } .fn.done.sharing .buddy .m-grin { display: inline; }

/* a pose for what it is doing right now */

.fn.running.k-read .buddy .bd { animation: b-breathe 2.6s ease-in-out infinite; }

.fn.waiting .fn-box { animation: b-call 1.8s ease-out infinite; }

.fn.done .buddy .bd { animation: b-content 5.5s ease-in-out infinite; animation-delay: var(--d, 0s); }
/* failed: dizzy */

.fn.poke .buddy .e-sleep, .fn.poke .buddy .fx .zzz, .fn.poke .buddy .e-open, .fn.poke .buddy .m-smile, .fn.poke .buddy .m-focus, .fn.poke .buddy .m-o { display: none !important; }

.pn.lead.ok b { color: var(--ok); }
.pn.high b { color: var(--bad); }
.pn.medium b { color: var(--warn); }
.pn.muted b { color: var(--text-2); font-size: 18px; }
.pn-sep { align-self: stretch; width: 1px; background: var(--line); }
.post-tools { margin-inline-start: auto; display: flex; align-items: center; gap: 12px; }
.ow-bar { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.ow-seg { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; gap: 6px; font: inherit; color: var(--text-3); }
.ow-seg i { height: 10px; border-radius: 3px; background: var(--seg, var(--line)); transition: transform .15s; }
.ow-seg:hover i { transform: scaleY(1.5); }
.ow-seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
.ow-seg span { font: 600 10.5px/1 ui-monospace, SFMono-Regular, Consolas, monospace; text-align: center; }
.ow-seg.fail { --seg: var(--bad); } .ow-seg.fail span { color: var(--bad); }
.ow-seg.warn { --seg: var(--warn); } .ow-seg.warn span { color: var(--warn); }
.ow-seg.pass { --seg: var(--ok); }
.ow-seg.todo { --seg: repeating-linear-gradient(45deg, var(--line) 0 4px, transparent 4px 7px); }
.ow-seg.todo i { background: repeating-linear-gradient(45deg, var(--line) 0 3px, var(--line-2) 3px 6px); }
.ow-seg.na { --seg: var(--line-2); }
.ow-legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--text-2); }
.ow-legend span { display: inline-flex; align-items: center; gap: 6px; }
.ow-legend i { width: 10px; height: 10px; border-radius: 3px; }
.ow-legend .fail i { background: var(--bad); } .ow-legend .warn i { background: var(--warn); } .ow-legend .pass i { background: var(--ok); }
.ow-legend .todo i { background: repeating-linear-gradient(45deg, var(--line) 0 3px, var(--line-2) 3px 6px); border: 1px solid var(--line); } .ow-legend .na i { background: var(--line-2); border: 1px solid var(--line); }

.ow-cat { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); background: var(--accent-soft); }
.ow-cat b { font-size: 14px; }
.ow-cat span { font-size: 13px; color: var(--text-2); line-height: 1.5; }
/* One card per OWASP category, with its checks */
.owc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.owc { padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 12px; scroll-margin: 120px; }
.owc.fail { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.owc.warn { border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); }
.owc-h { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.owc-code { font: 700 13px/1 ui-monospace, SFMono-Regular, Consolas, monospace; width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); }
.owc.fail .owc-code { background: var(--bad); border-color: var(--bad); color: #fff; }
.owc.warn .owc-code { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
.owc.pass .owc-code { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: var(--ok-soft); }
.owc-t { min-width: 0; }
.owc-t b { display: block; font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; line-height: 1.3; }
.owc-t span { display: block; font-size: 12.5px; color: var(--text-3); line-height: 1.45; margin-top: 3px; }
.verdict { font-size: 11px; font-weight: 650; padding: 3px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); color: var(--text-3); }
.verdict.fail { background: var(--bad); border-color: var(--bad); color: #fff; }
.verdict.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.verdict.pass { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: var(--ok-soft); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line-2); }
.ck { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--line-2); font-size: 13px; }
.ck:last-child { border-bottom: 0; }
.ck-i { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; border: 1.5px solid var(--line); color: #fff; }
.ck-i svg { width: 11px; height: 11px; stroke-width: 3; }
.ck.pass .ck-i { background: var(--ok); border-color: var(--ok); }
.ck.fail .ck-i { background: var(--bad); border-color: var(--bad); }
.ck.todo .ck-i { border-style: dashed; }
.ck.na .ck-i { background: var(--line-2); border-color: var(--line-2); }
.ck.na .ck-i::after { content: ""; width: 8px; height: 1.5px; background: var(--text-3); }
.ck-t { color: var(--text); line-height: 1.4; }
.ck.todo .ck-t, .ck.na .ck-t { color: var(--text-2); }
.ck.na .ck-t { text-decoration: line-through; text-decoration-color: var(--text-3); }
.ck.fail .ck-t { font-weight: 600; }
.ck-sec { cursor: pointer; }
.ck-sec:hover { border-color: var(--text-3); color: var(--text); }
.ck-note { font-size: 11.5px; color: var(--text-3); }
.owc-f { display: flex; align-items: center; gap: 10px; }
.ck-meter { flex: 1; display: flex; gap: 3px; }
.ck-meter i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.ck-meter i.pass { background: var(--ok); } .ck-meter i.fail { background: var(--bad); } .ck-meter i.na { background: var(--line-2); }
.ck-count { font: 600 11.5px/1 ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--text-3); }
.owc-code { position: relative; background: conic-gradient(var(--ring, var(--ok)) calc(var(--pp) * 1%), var(--line-2) 0) !important; border: 0 !important; padding: 3px; animation: ow-ring 1.1s cubic-bezier(.2, .8, .2, 1) calc(var(--i) * 60ms + 150ms) both; }
.owc-code > span { width: 100%; height: 100%; border-radius: 8px; display: grid; place-items: center; background: var(--surface); }
.owc.fail .owc-code { --ring: var(--bad); color: var(--bad); }
.owc.warn .owc-code { --ring: var(--warn); }
.owc.fail .owc-code > span { background: color-mix(in srgb, var(--bad) 9%, var(--surface)); }
@property --pp { syntax: "<number>"; initial-value: 0; inherits: true; }
.owc { --pp: var(--p); animation: ow-in .5s cubic-bezier(.2, .8, .2, 1) calc(var(--i) * 45ms) both; transition: transform .2s, box-shadow .2s; position: relative; overflow: hidden; }
.owc:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(15, 23, 42, .08); }
.owc.fail::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--bad); }
.owc.scanning::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--accent) 10%, transparent) 50%, transparent 70%); background-size: 250% 100%; animation: ow-scan 2s linear infinite; pointer-events: none; }
.ck { animation: ck-in .35s ease-out calc(var(--i) * 50ms + 250ms) both; }
.ck.pass .ck-i, .ck.fail .ck-i { animation: ck-pop .4s cubic-bezier(.3, 1.8, .5, 1) calc(var(--i) * 50ms + 350ms) both; }
.ck.fail .ck-i { box-shadow: 0 0 0 0 color-mix(in srgb, var(--bad) 45%, transparent); animation: ck-pop .4s cubic-bezier(.3, 1.8, .5, 1) calc(var(--i) * 50ms + 350ms) both, ck-alarm 2.2s ease-out 1.2s infinite; }
.ck-meter i { transform-origin: left; animation: ck-fill .5s ease-out calc(var(--i) * 70ms + 300ms) both; }
:root[dir="rtl"] .ck-meter i { transform-origin: right; }
.ow-seg i { transform-origin: left; animation: ck-fill .55s cubic-bezier(.2, .8, .2, 1) calc(var(--i) * 50ms) both; }
.ow-seg.fail i { animation: ck-fill .55s cubic-bezier(.2, .8, .2, 1) calc(var(--i) * 50ms) both, seg-glow 2s ease-in-out 1s infinite; }
.ow-seg.scanning i { background: linear-gradient(90deg, var(--line) 0 35%, var(--accent) 50%, var(--line) 65%); background-size: 300% 100%; animation: ow-scan 1.6s linear infinite; }
.pn b { animation: ow-in .5s ease-out both; }
.owc-tk { display: flex; flex-wrap: wrap; gap: 6px; margin-top: -4px; }
.tk-chip { appearance: none; font: 600 11px/1 ui-monospace, SFMono-Regular, Consolas, monospace; padding: 5px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tk-chip:hover { border-color: var(--text-3); }
.tk-chip.live { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--accent-soft); }
.tk-chip.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: ping 1.6s ease-out infinite; }
.tk-chip.pass { color: var(--ok); } .tk-chip.fail { color: var(--bad); }
.rv { display: flex; flex-direction: column; gap: 10px; }
.rv-cat { border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px 4px; }
.rv-cat.fail { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.rv-cat.pass { border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.rv-h { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.rv-h b { flex: 1; font-size: 13.5px; }
.rv-why { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
.rv-cat .checks { border-top: 0; }
.rv-skip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); padding: 4px 2px; }
.rv-skip span:first-child { margin-inline-end: 4px; }
.rv-skip .tag { opacity: .7; text-decoration: line-through; }
@keyframes ow-in { from { opacity: 0; transform: translateY(8px); } }
@keyframes ow-ring { from { --pp: 0; } }
@keyframes ow-scan { from { background-position: 100% 0; } to { background-position: -150% 0; } }
@keyframes ck-in { from { opacity: 0; transform: translateX(-6px); } }
@keyframes ck-pop { from { transform: scale(0); } }
@keyframes ck-alarm { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--bad) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
@keyframes ck-fill { from { transform: scaleX(0); } }
@keyframes seg-glow { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 25%, transparent); } }
@media (prefers-reduced-motion: reduce) { .owc, .owc-code, .ck, .ck-i, .ck-meter i, .ow-seg i, .pn b, .owc.scanning::after, .tk-chip.live::before { animation: none !important; } .owc:hover { transform: none; } }
@media (max-width: 860px) { .owc-grid { grid-template-columns: minmax(0, 1fr); } .ow-bar span { font-size: 9px; } .pn.lead b { font-size: 32px; } }

/* Agents — a pit wall: one lane per agent, the day as a timing strip */
.crew-wall { padding: 0; overflow: hidden; }
.lane { display: grid; grid-template-columns: 72px 200px minmax(0, 1fr) 96px; gap: 18px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--line-2); position: relative; }
.lane:first-child { border-top: 0; }
.lane.act:hover { background: color-mix(in srgb, var(--role) 4%, var(--surface)); }
.lane::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 3px; background: var(--role); opacity: 0; transition: opacity .2s; }
.lane.on::before, .lane.act:hover::before { opacity: 1; }
.lane .ab { width: 72px; height: 64px; display: grid; place-items: center; gap: 0; }
.lane .ab svg.buddy { width: 60px; height: 60px; overflow: visible; color: var(--role); }
.lane.rest { padding-block: 8px; }
.lane.rest .ab svg.buddy { width: 44px; height: 44px; }
.lane.rest .ab { height: 46px; }
.who { min-width: 0; }
.who b { display: block; font-size: 15px; font-weight: 700; letter-spacing: -.015em; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane.rest .who b { font-size: 13.5px; font-weight: 650; }
.who .role-l { display: block; font: 500 11px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane.child { padding-inline-start: 52px; }
.lane.child .ab::after { content: ""; position: absolute; inset-inline-start: -30px; top: -22px; height: 54px; width: 32px; border-inline-start: 2px solid color-mix(in srgb, var(--role) 45%, var(--line)); border-bottom: 2px solid color-mix(in srgb, var(--role) 45%, var(--line)); border-end-start-radius: 10px; }
.lane .ab { position: relative; }
.who .by { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.nums .none-n { color: var(--text-3); }
.who .mood { align-items: center; gap: 6px; margin-top: 5px; font-size: 11.5px; font-weight: 650; color: var(--text-3); }
.who .mood::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.lane.on .who .mood { color: var(--role); }
.lane.on .who .mood::before { animation: ping 1.8s ease-out infinite; }
.lane-mid { min-width: 0; display: flex; flex-direction: column; gap: 9px; }
.say { position: relative; align-self: flex-start; max-width: 100%; padding: 8px 12px; border-radius: 4px 12px 12px 12px; background: color-mix(in srgb, var(--role) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--role) 24%, transparent); font-size: 13px; line-height: 1.45; min-width: 0; }
:root[dir="rtl"] .say { border-radius: 12px 4px 12px 12px; }
.say .say-t { display: block; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.say .say-now { display: flex; align-items: center; gap: 6px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.say .say-now svg { width: 13px; height: 13px; color: var(--k); flex: none; }
.say .say-trail { display: block; font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.say .say-now span { overflow: hidden; text-overflow: ellipsis; }
.lane .note { font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip { position: relative; height: 14px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--line-2) 0 1px, transparent 1px calc(100% / 24)), var(--surface-2); border: 1px solid var(--line-2); }
.lane.rest .strip { height: 8px; }
.strip i { position: absolute; top: 1px; bottom: 1px; min-width: 3px; border-radius: 2px; background: var(--role); opacity: .85; }
.strip i.live { opacity: 1; box-shadow: 0 0 0 2px color-mix(in srgb, var(--role) 25%, transparent); }
.strip .nowm { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); border-radius: 1px; }
:root[dir="rtl"] .strip { transform: scaleX(-1); }
.lane.scale { padding-block: 8px 12px; }
.strip-scale { display: flex; justify-content: space-between; font: 500 10px/1 ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--text-3); }
.nums { text-align: end; font: 500 11.5px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--text-3); font-variant-numeric: tabular-nums; }
.nums b { color: var(--text); font-weight: 650; }
.nums .clock { display: block; font-size: 17px; font-weight: 650; color: var(--role); letter-spacing: -.02em; }
.wall-h { display: flex; align-items: baseline; gap: 8px; padding: 12px 20px 10px; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); border-top: 1px solid var(--line); background: var(--surface-2); }
.wall-h:first-child { border-top: 0; }
@media (max-width: 860px) {
  .lane { grid-template-columns: 56px minmax(0, 1fr) auto; }
  .lane .lane-mid { grid-column: 1 / -1; }
  .lane .ab, .lane.rest .ab { width: 56px; }
  .lane.scale { display: none; }
}

/* Who is working: the coordinator and the agents and helpers it started */
.tree { padding: 16px 18px; overflow-x: auto; }
.tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul ul { padding-inline-start: 30px; position: relative; }
.tree ul ul > li { position: relative; padding-top: 10px; }
.tree ul ul > li::before { content: ""; position: absolute; inset-inline-start: -18px; top: 0; bottom: 0; border-inline-start: 2px solid var(--line); }
.tree ul ul > li:last-child::before { bottom: auto; height: 31px; }
.tree ul ul > li::after { content: ""; position: absolute; inset-inline-start: -18px; top: 31px; width: 16px; border-top: 2px solid var(--line); }
.tree li.on::before, .tree li.on::after { border-color: color-mix(in srgb, var(--role) 55%, var(--line)); }
.tnode { display: inline-flex; align-items: center; gap: 10px; padding: 7px 12px 7px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); max-width: 100%; min-width: 0; }
.tnode.on { border-color: color-mix(in srgb, var(--role) 50%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--role) 12%, transparent); }
.tnode.act:hover { background: var(--surface-2); }
.tnode .avatar { width: 30px; height: 30px; border-radius: 9px; font-size: 11px; }
.tnode .tn { min-width: 0; display: flex; flex-direction: column; }
.tnode .tn b { font-size: 13px; font-weight: 650; white-space: nowrap; }
.tnode .tn b small { font-size: 11px; font-weight: 600; color: var(--text-3); margin: 0 6px; }
.tnode .tn span { font-size: 12px; color: var(--text-2); max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tnode .tn span svg { width: 12px; height: 12px; vertical-align: -2px; color: var(--k); margin-inline-end: 4px; }
.tnode .clock { font-size: 12px; font-weight: 650; color: var(--text-2); font-variant-numeric: tabular-nums; margin-inline-start: 6px; }
.tnode .kind-tag { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); padding: 2px 6px; border: 1px dashed var(--line); border-radius: 6px; }
:root[dir="rtl"] .tree li, :root[dir="rtl"] .feed li, :root[dir="rtl"] .crit li, :root[dir="rtl"] .notes li { unicode-bidi: normal; }
.tree .quiet { font-size: 13px; color: var(--text-3); padding: 10px 0 0 4px; }
.sess { border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; }
.sess + .sess { margin-top: 8px; }
.sess summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; font-size: 13px; background: var(--surface-2); }
.sess summary::-webkit-details-marker { display: none; }
.sess summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.sess summary .t { min-width: 0; }
.sess summary .t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sess summary .t span { display: block; font-size: 12px; color: var(--text-3); }
.sess summary em { font-style: normal; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.sess .sess-body { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.sess .feed { max-height: 280px; overflow-y: auto; }
.sess.on { border-color: color-mix(in srgb, var(--role) 45%, var(--line)); }
.dotst { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.dotst.on { background: var(--ok); animation: ping 1.8s ease-out infinite; }
@media (max-width: 560px) { .sec-head .search, .sec-head .search input { width: 100%; } .sec-row, .idea-row { grid-template-columns: auto minmax(0, 1fr) auto; } .sec-row .tag, .sec-row .tid, .idea-row .tid, .idea-row .sz { display: none; } }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet-bg { animation: none; } .dotst.on { animation: none; } }

/* ===== Theme: black, white and red ===== */
:root {
  --bg: #F4F4F4; --surface: #FFFFFF; --surface-2: #F7F7F7; --text: #0A0A0A; --text-2: #3D3D3D; --text-3: #8C8C8C;
  --line: #E2E2E2; --line-2: #EEEEEE; --shadow: 0 1px 0 #E2E2E2;
  --accent: #E10600; --accent-soft: #FDECEC; --ok: #0A0A0A; --ok-soft: #EFEFEF; --bad: #E10600; --bad-soft: #FDECEC; --warn: #3D3D3D; --warn-soft: #EFEFEF;
  --r-pm: #1A1A1A; --r-rs: #3A3A3A; --r-pj: #555555; --r-dl: #1A1A1A; --r-qa: #3A3A3A; --r-rw: #707070; --r-am: #8C8C8C; --r-rv: #555555; --r-se: #2A2A2A; --r-sm: #707070; --r-ds: #3A3A3A;
  --r-x1: #2A2A2A; --r-x2: #4A4A4A; --r-x3: #6A6A6A; --r-x4: #8A8A8A; --r-x5: #5A5A5A;
  --k-read: #8C8C8C; --k-edit: #E10600; --k-run: #0A0A0A; --k-search: #555555; --k-web: #3A3A3A; --k-tracker: #A8A8A8; --k-tool: #C4C4C4;

}
@media (prefers-color-scheme: dark) {

    --accent: #FF2A1F; --accent-soft: #2A0E0D; --ok: #F2F2F2; --ok-soft: #222222; --bad: #FF2A1F; --bad-soft: #2A0E0D; --warn: #BDBDBD; --warn-soft: #222222;

    --k-read: #8A8A8A; --k-edit: #FF2A1F; --k-run: #F2F2F2; --k-search: #B0B0B0; --k-web: #CFCFCF; --k-tracker: #6A6A6A; --k-tool: #555555;
    --asphalt: #050505; --asphalt-2: #141414;
  }
}
.title b, .section-head h2, .sec-h, .pn b, .pw-big b { font-family: var(--round); }
/* logo: black tile, white bolt, kerb stripe */
.logo { position: relative; background: #0A0A0A; color: #fff; box-shadow: none; overflow: hidden; width: 36px; height: 36px; border-radius: 10px; }
.logo svg { position: relative; z-index: 1; margin-bottom: 6px; }
.logo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: repeating-linear-gradient(90deg, var(--kerb) 0 6px, #fff 6px 12px); }
.title b { font-weight: 800; letter-spacing: -.02em; }
@media (prefers-color-scheme: dark) { .logo { box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); } }
/* header tabs: quiet links, red mark on the open one */
.tabs { background: transparent; border: 0; padding: 0; gap: 4px; }
.tab { height: 32px; border-radius: 999px; padding: 0 12px; }
.tab:hover { background: var(--line-2); }
.tab[aria-selected="true"] { background: var(--text); color: var(--bg); box-shadow: none; }
.tab[aria-selected="true"] .badge { background: var(--kerb); color: #fff; }
.tab .badge.alert { background: var(--kerb); color: #fff; }
.pill.on { background: var(--text); color: var(--bg); border-color: var(--text); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.pill.on .led { background: var(--kerb); }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--kerb) 60%, transparent); } 80%, 100% { box-shadow: 0 0 0 7px transparent; } }
/* your move: kerb stripe down the side */
.ask { position: relative; border: 0; border-radius: 18px; padding-inline-start: 34px; box-shadow: 0 1px 0 var(--line), 0 14px 30px -20px rgba(0,0,0,.35); overflow: hidden; }
.ask::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 12px; background: repeating-linear-gradient(180deg, var(--kerb) 0 12px, #fff 12px 24px); }
.ask-ico { background: var(--kerb); color: #fff; }
.ask-txt b { color: var(--kerb); font-weight: 800; }
.ask-txt span { font-family: var(--round); font-size: 17px; }
.btn.primary { background: var(--text); border-color: var(--text); color: var(--bg); }
.btn.primary:hover { background: var(--kerb); border-color: var(--kerb); color: #fff; filter: none; }
/* the workflow is a pit lane */
.flow-card { background: var(--asphalt); border: 0; border-radius: 22px; color: #F2F2F2; position: relative; }
.flow-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px; z-index: 2; background: repeating-linear-gradient(90deg, var(--kerb) 0 18px, #fff 18px 36px); }
.flow { background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.2px); background-size: 6px 6px; padding-top: 44px; }
.fn-box { background: var(--asphalt-2); border: 2px solid rgba(255,255,255,.1); border-radius: 18px; box-shadow: none; }
.fn.todo .fn-box { background: var(--asphalt-2); border-style: dashed; border-color: rgba(255,255,255,.12); }
.fn.done .fn-box { border-color: rgba(255,255,255,.55); }
.fn.current .fn-box, .fn.waiting .fn-box { border-color: var(--kerb); }
.fn.running .fn-box { border-color: var(--kerb); box-shadow: 0 0 0 6px color-mix(in srgb, var(--kerb) 18%, transparent), 0 0 30px color-mix(in srgb, var(--kerb) 40%, transparent); animation: none; }
.fn.fail .fn-box { border-color: var(--kerb); }
.fn-label { color: #F2F2F2; }
.fn.todo .fn-label { color: rgba(255,255,255,.55); }
.fn-sub { color: rgba(255,255,255,.5); }
.fn.running .fn-sub, .fn.waiting .fn-sub { color: var(--kerb); }
.fn.done .fn-badge { background: #fff; color: #0A0A0A; border-color: var(--asphalt); }
.fn.running .fn-badge, .fn.waiting .fn-badge, .fn.fail .fn-badge { background: var(--kerb); border-color: var(--asphalt); }
.fn-badge { border-color: var(--asphalt); }
.fn-live { background: #1F1F1F; border-color: rgba(255,255,255,.12); color: #F2F2F2; box-shadow: none; }
.fn-live .now { color: #F2F2F2; } .fn-live .meta { color: rgba(255,255,255,.5); }
.edge { stroke: rgba(255,255,255,.22); stroke-dasharray: 10 8; stroke-width: 3; }
.edge.done { stroke: var(--kerb); stroke-dasharray: none; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--kerb) 60%, transparent)); }
.edge.active { stroke: var(--kerb); }
.edge.aux { stroke: rgba(255,255,255,.25); }
.edge.aux.active { stroke: var(--kerb); }
.port { fill: var(--asphalt); stroke: rgba(255,255,255,.35); }
.edge-paper { fill: #fff; stroke: var(--kerb); } .edge-paper-line { stroke: var(--kerb); }
.flow-tab { border-color: var(--line); }
.flow-tab[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.flow-tab .dot.on { background: var(--kerb); }
.flow-foot { background: #121212; border-top: 1px solid #1F1F1F; color: rgba(255,255,255,.6); }
.flow-foot .stat { background: #1B1B1B; border-color: #262626; color: rgba(255,255,255,.65); }
.flow-foot .stat b { color: #fff; } .flow-foot .stat.alert b, .flow-foot .stat.live b { color: var(--kerb); }
.flow-panel { background: var(--surface); color: var(--text); }
/* characters: red when working, white when done, grey asleep */
:is(.flow, .lane, .move) .fn.todo { --role: #5A5A5A !important; }
.flow .fn.done { --role: #E9E9E9 !important; }
.lane .fn.done { --role: var(--text) !important; }
.lane.on { --role: var(--kerb) !important; }
.lane.on .say { background: var(--accent-soft); border-color: color-mix(in srgb, var(--kerb) 30%, transparent); }
:is(.flow, .lane) .fn:is(.running, .current, .waiting, .fail) { --role: #E10600 !important; }
.buddy .hat-y, .buddy .hat-p, .buddy .bulb { fill: #FFFFFF; }
.buddy .hat-g { fill: #CFCFCF; } .buddy .hat-k { fill: #0A0A0A; }
.buddy .cheek, .buddy .tongue { fill: #E10600; } .buddy .cheek { opacity: .45; }
.buddy .fx .spark, .buddy .star, .buddy .spark { fill: #E10600; }
.buddy .fx .drop { fill: #FFFFFF; }
.buddy .ink { fill: #0A0A0A; } .buddy .ink-s { stroke: #0A0A0A; }
.buddy .skin-d { fill: color-mix(in srgb, var(--role) 70%, #000); }
.fn.todo .buddy .bd { filter: none; opacity: .9; }
.fn.running .fn-box::before { background: conic-gradient(from var(--spin), transparent 0 55%, color-mix(in srgb, var(--kerb) 70%, transparent) 75%, var(--kerb) 80%, transparent 85%); }
@keyframes b-glow { from { fill: #fff; } to { fill: #E10600; } }
/* ticker under the lane */
.ticker { display: flex; align-items: center; gap: 12px; margin: 0 18px 14px; padding: 11px 14px; border-radius: 12px; background: rgba(255,255,255,.05); font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; color: #D6D6D6; }
.tk-who { color: #fff; font-weight: 800; background: var(--kerb); padding: 2px 8px; border-radius: 5px; font-family: var(--round); }
.tk-txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tk-clock { margin-inline-start: auto; color: #fff; font-weight: 700; }
.caret { display: inline-block; width: 7px; height: 14px; background: var(--kerb); flex: none; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
/* plan window */
.planwin { padding: 0; overflow: hidden; }
.pw-head { display: flex; align-items: center; gap: 22px; padding: 18px 20px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.pw-big { display: flex; align-items: baseline; gap: 6px; }
.pw-big b { font-size: 38px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.pw-big span { color: var(--text-3); font-weight: 650; }
.pw-meter { flex: 1; min-width: 160px; display: flex; gap: 4px; }
.pw-meter i { flex: 1; height: 10px; border-radius: 3px; background: var(--line); }
.pw-meter i.on { background: var(--text); }
.pw-meter i.on:last-of-type, .pw-meter i.on + i:not(.on) { }
.pw-next { display: flex; flex-direction: column; }
.pw-next small { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--kerb); }
.pw-next b { font-family: var(--round); font-size: 15px; }
.pw-list { list-style: none; margin: 0; padding: 0; }
.pw-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line-2); }
.pw-row:first-child { border-top: 0; }
.pw-n { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font: 700 12px ui-monospace, SFMono-Regular, Consolas, monospace; border: 1px solid var(--line); color: var(--text-2); }
.pw-row.next .pw-n { background: var(--text); color: var(--bg); border-color: var(--text); }
.pw-row.in-progress .pw-n { background: var(--kerb); color: #fff; border-color: var(--kerb); }
.pw-t { min-width: 0; } .pw-t b { display: block; font-weight: 650; } .pw-t span { display: block; font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pw-st { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
.pw-row.next .pw-st { color: var(--text); } .pw-row.in-progress .pw-st { color: var(--kerb); }
/* steppers and small marks follow the palette */
.st.done .node { background: var(--text); border-color: var(--text); color: var(--bg); }
.st.done::before, .st.current::before, .st.fail::before { background: var(--text); }
.st.current .node { border-color: var(--kerb); color: var(--kerb); box-shadow: 0 0 0 4px var(--accent-soft); }
.st.current .node::after { background: var(--kerb); } .st.current .st-name { color: var(--kerb); }
@media (max-width: 560px) { .pw-row { grid-template-columns: 30px minmax(0, 1fr) auto; } .pw-st { display: none; } }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
</style>

    if (secOpen(x) && x.id) {
      btns.appendChild(copyButton(L.secFix, '/team-security fix ' + x.id, L.copiedStart, 'primary', L.copyFailed));
      btns.appendChild(copyButton(L.accept, '/team-security accept ' + x.id + ' ', L.copiedStart, '', L.copyFailed));
    }

  }

  // ---------- Agents ----------
  function rosterAgents(d, list) {
    var order = Object.keys(ROLES).map(function (r) { return 'team:' + r; });
    (Array.isArray(d.customAgents) ? d.customAgents : []).forEach(function (c) { if (c && c.agent && order.indexOf(c.agent) < 0) order.push(c.agent); });
    list.forEach(function (s) { if (s.agent && order.indexOf(s.agent) < 0) order.push(s.agent); });
    return order;
  }
  function agentStats(agent, list, now) {
    var runs = list.filter(function (s) { return s.agent === agent; }).sort(function (a, b) { return b.start - a.start; });
    var day = dayStart(now);
    var segs = [], ms0 = 0, acts = 0;
    runs.forEach(function (s) {
      if ((s.end || now) < day) return;
      segs.push({ s: Math.max(s.start, day), e: s.end || now, live: !s.end });
      ms0 += (s.end || now) - Math.max(s.start, day);
      acts += s.actions.filter(function (a) { return a.t >= day; }).length;
    });
    (history || []).forEach(function (h) {
      if (h.a !== agent) return;
      var s = ms(h.s), e = ms(h.e);
      if (e < day || runs.some(function (r) { return Math.abs(r.start - s) < 2000; })) return;
      segs.push({ s: Math.max(s, day), e: e, live: false }); ms0 += e - Math.max(s, day); acts += h.n || 0;
    });
    return { runs: runs, running: runs.filter(function (s) { return !s.end; }), todayRuns: segs.length, todayActs: acts, todayMin: Math.round(ms0 / 60000), segs: segs, day: day };
  }
  function dayStrip(st, now) {
    var strip = el('div', 'strip');
    var pct = function (t) { return Math.max(0, Math.min(100, (t - st.day) / DAY * 100)); };
    st.segs.forEach(function (g) {
      var i = el('i', g.live ? 'live' : '');
      i.style.left = pct(g.s).toFixed(2) + '%';
      i.style.width = Math.max(0.4, pct(g.e) - pct(g.s)).toFixed(2) + '%';
      i.title = hhmm(new Date(g.s).toISOString()) + ' – ' + hhmm(new Date(g.e).toISOString());
      strip.appendChild(i);
    });
    var m = el('span', 'nowm'); m.style.left = 'calc(' + pct(Math.floor(now / 60000) * 60000).toFixed(2) + '% - 1px)'; strip.appendChild(m);
    return strip;
  }
  function agentLane(agent, st, L, d, now, opts) {
    var on = st.running.length > 0;
    var rest = !on;
    var lane = el('div', 'lane' + (on ? ' on' : ' rest') + (opts && opts.child ? ' child' : '')); setRole(lane, agent);
    var mood = on ? 'running' : st.todayRuns ? 'done' : 'todo';
    var cur = on ? st.running[0] : null;
    var last = cur && cur.actions[cur.actions.length - 1];
    var ab = el('div', 'ab fn ' + mood + (last ? ' k-' + last.k : ''));
    ab.appendChild(buddy(agent, last ? last.k : 'agents'));
    ab.addEventListener('pointerdown', function (e) { e.stopPropagation(); poke(ab); });
    lane.appendChild(ab);
    var who = el('div', 'who');
    who.appendChild(el('b', '', roleName(agent, L)));
    who.appendChild(el('span', 'role-l', L.names[role(agent)] ? roleTitle(agent, L) : isTeam(agent) ? agent : agent + ' · ' + L.helper));
    if (opts && opts.by) who.appendChild(el('span', 'by', L.startedBy + ' ' + opts.by));
    if (on || st.todayRuns) who.appendChild(el('span', 'mood', on ? L.working + (st.running.length > 1 ? ' ×' + st.running.length : '') : L.finished));
    who.title = roleDesc(agent, L, d);
    lane.appendChild(who);
    var mid = el('div', 'lane-mid');
    if (on) {
      st.running.forEach(function (s) {
        var say = el('div', 'say');
        say.appendChild(el('span', 'say-t', s.task || roleDesc(agent, L, d)));
        var a = s.actions[s.actions.length - 1];
        var nowL = el('span', 'say-now'); setKind(nowL, a ? a.k : 'tool');
        nowL.appendChild(icon(a ? a.k : 'tool')); nowL.appendChild(el('span', '', a ? actionText(a, L) : L.working + '…'));
        say.appendChild(nowL);
        var trail = s.actions.slice(-4, -1).reverse().map(function (x) { return actionText(x, L); });
        if (trail.length) say.appendChild(el('span', 'say-trail', trail.join('  ·  ')));
        mid.appendChild(say);
      });
    } else {
      var lr = st.runs[0];
      mid.appendChild(el('div', 'note', lr ? L.lastSeen + ' ' + hhmm(new Date(lr.end || lr.start).toISOString()) + (lr.task ? ' — ' + lr.task : '') : roleDesc(agent, L, d)));
    }
    mid.appendChild(dayStrip(st, now));
    lane.appendChild(mid);
    var nums = el('div', 'nums'); nums.dir = 'ltr';
    if (on) nums.appendChild(clockEl(cur.start, null));
    if (!on && !st.todayRuns) { nums.appendChild(el('div', 'none-n', '—')); }
    else {
    var l1 = el('div'); l1.appendChild(el('b', '', st.todayRuns)); l1.appendChild(document.createTextNode(' ' + (st.todayRuns === 1 ? L.run : L.runs))); nums.appendChild(l1);
    var l2 = el('div'); l2.appendChild(el('b', '', st.todayActs)); l2.appendChild(document.createTextNode(' ' + L.actions)); nums.appendChild(l2);
    if (!on && st.todayMin) { var l3 = el('div'); l3.appendChild(el('b', '', fmtMin(st.todayMin))); nums.appendChild(l3); }
    }
    lane.appendChild(nums);
    act(lane, function () { openSheet('agent', agent, cur ? cur.id : null); }, roleName(agent, L));
    return lane;
  }
  function renderAgents(d, L, list, now) {
    $('tab-agents-text').textContent = L.tabAgents;
    var running = list.filter(function (s) { return !s.end; });
    $('tab-agents-badge').hidden = !running.length; $('tab-agents-badge').textContent = running.length;
    $('h-agents').textContent = L.allAgents;
    var roster = rosterAgents(d, list);
    $('c-agents').textContent = String(roster.length) + ' · ' + L.today.toLowerCase();
    var all = roster.map(function (a) { return { agent: a, st: agentStats(a, list, now) }; });
    var busy = all.filter(function (x) { return x.st.running.length; });
    var rest = all.filter(function (x) { return !x.st.running.length; }).sort(function (a, b) { return (b.st.runs[0] ? b.st.runs[0].start : 0) - (a.st.runs[0] ? a.st.runs[0].start : 0); });
    var wrap = el('div');
    var wall = el('div', 'card crew-wall'); wrap.appendChild(wall);
    var head = function (t, n) { var h = el('div', 'wall-h'); h.appendChild(el('span', '', t)); h.appendChild(el('span', '', String(n))); wall.appendChild(h); };
    if (busy.length) {
      head(L.working, busy.length);
      // a helper sits right under the agent that started it
      var byRun = {}; running.forEach(function (r) { byRun[r.id] = r; });
      var parentOf = function (x) { var r = x.st.running[0]; return r && r.parent && byRun[r.parent] ? byRun[r.parent] : null; };
      var placed = {};
      var put = function (x, child) {
        if (placed[x.agent]) return; placed[x.agent] = true;
        var p = parentOf(x);
        wall.appendChild(agentLane(x.agent, x.st, L, d, now, child && p ? { child: true, by: roleName(p.agent, L) } : null));
        busy.forEach(function (y) { var q = parentOf(y); if (q && q.agent === x.agent) put(y, true); });
      };
      busy.filter(function (x) { return !parentOf(x); }).forEach(function (x) { put(x, false); });
      busy.forEach(function (x) { put(x, true); });
    }
    head(L.idleAgent, rest.length);
    rest.forEach(function (x) { wall.appendChild(agentLane(x.agent, x.st, L, d, now)); });
    var sr = el('div', 'lane scale'); sr.appendChild(el('span')); sr.appendChild(el('span'));
    var sc = el('div', 'strip-scale'); sc.dir = 'ltr';
    ['00:00', '06:00', '12:00', '18:00', '24:00'].forEach(function (h) { sc.appendChild(el('span', '', h)); });
    sr.appendChild(sc); sr.appendChild(el('span')); wall.appendChild(sr);
    patch($('agents-grid'), wrap);
  }
  function treeNode(L, o) {
    var n = el('div', 'tnode' + (o.on ? ' on' : ''));
    if (o.agent) setRole(n, o.agent); else n.style.setProperty('--role', 'var(--accent)');
    var av = el('div', 'avatar', o.initials || initials(o.agent, L)); n.appendChild(av);
    var tn = el('div', 'tn');
    var b = el('b', '', o.name); if (o.small) b.appendChild(el('small', '', o.small)); tn.appendChild(b);
    var sp = el('span');
    if (o.last) { setKind(sp, o.last.k); sp.appendChild(icon(o.last.k)); sp.appendChild(document.createTextNode(actionText(o.last, L))); }
    else sp.textContent = o.line || '';
    if (o.line && o.last) sp.title = o.line;
    tn.appendChild(sp); n.appendChild(tn);
    if (o.tag) n.appendChild(el('span', 'kind-tag', o.tag));
    if (o.since) n.appendChild(clockEl(o.since, null));
    if (o.open) act(n, o.open, o.name);
    return n;
  }
  function buildTree(d, L, list, now, always) {
    var running = list.filter(function (s) { return !s.end; });
    var wrap = el('div');
    var nowList = Array.isArray(d.now) ? d.now : d.now ? [d.now] : [];
    var coordOn = running.length > 0 || nowList.length > 0;
    var root = el('ul'), rli = el('li'); root.appendChild(rli);
    var coordLine = nowList.length ? nowList.map(function (x) { return x.task || ''; }).filter(Boolean).join(' · ') : (Array.isArray(d.pending) && d.pending.length ? L.needsYouShort : L.coordinatorRole);
    rli.appendChild(treeNode(L, { name: L.coordinator, small: running.length ? running.length + ' ' + L.subAgents : '', initials: 'CC', on: coordOn, line: coordLine, open: null }));
    var byId = {}; running.forEach(function (s) { byId[s.id] = s; });
    var top = running.filter(function (s) { return !s.parent || !byId[s.parent]; });
    var kids = function (s) { return running.filter(function (x) { return x.parent === s.id; }); };
    var add = function (parentLi, s) {
      var ul = parentLi.querySelector(':scope > ul') || parentLi.appendChild(el('ul'));
      var li = el('li', 'on'); setRole(li, s.agent);
      li.appendChild(treeNode(L, { agent: s.agent, name: roleName(s.agent, L), small: L.names[role(s.agent)] ? roleTitle(s.agent, L) : '', on: true, last: s.actions[s.actions.length - 1], line: s.task || (s.helper ? roleDesc(s.agent, L, d) : L.working + '…'), tag: s.helper ? L.helper : '', since: s.start, open: function () { openSheet('agent', s.agent, s.id); } }));
      ul.appendChild(li);
      kids(s).forEach(function (k) { add(li, k); });
    };
    top.sort(function (a, b) { return (a.helper ? 1 : 0) - (b.helper ? 1 : 0) || a.start - b.start; }).forEach(function (s) { add(rli, s); });
    wrap.appendChild(root);
    if (!running.length && always) wrap.appendChild(el('div', 'quiet', L.allQuietSub));
    return wrap;
  }
  function renderLiveTree(d, L, list, now) {
    var running = list.filter(function (s) { return !s.end; });
    var sec = $('tree-section');
    sec.hidden = !running.length;
    if (!running.length) return;
    $('h-livetree').textContent = L.whoWorks;
    $('c-livetree').textContent = running.length + ' · ' + L.whoWorksSub;
    patch($('live-tree'), buildTree(d, L, list, now, false));
  }
  function sessionBody(s, L, list, now) {
    var body = el('div', 'sess-body');
    if (s.task) { var task = el('div', 'task'); task.appendChild(el('b', '', L.task)); task.appendChild(document.createTextNode(s.task)); body.appendChild(task); }
    var parent = s.parent ? list.filter(function (x) { return x.id === s.parent; })[0] : null;
    kv(body, [[L.startedBy, parent ? roleName(parent.agent, L) : L.coordinator], [L.started.charAt(0).toUpperCase() + L.started.slice(1), hhmm(new Date(s.start).toISOString())], [L.finished, s.end ? hhmm(new Date(s.end).toISOString()) : null]]);
    var last = s.actions[s.actions.length - 1];
    if (last && !s.end) {
      var doing = el('div', 'doing'); setKind(doing, last.k);
      var ic = el('div', 'ico'); ic.appendChild(icon(last.k)); doing.appendChild(ic);
      doing.appendChild(el('span', '', actionText(last, L)));
      body.appendChild(doing);
    }
    if (s.actions.length) {
      var counts = {};
      s.actions.forEach(function (a) { counts[a.k] = (counts[a.k] || 0) + 1; });
      var chips = el('div', 'chips');
      KINDS.forEach(function (k) { if (!counts[k]) return; var c = el('span', 'chip'); setKind(c, k); c.appendChild(el('i')); c.appendChild(document.createTextNode(L.kindsShort[k] + ' ' + counts[k])); chips.appendChild(c); });
      body.appendChild(chips);
      var feed = el('ol', 'feed');
      s.actions.slice().reverse().forEach(function (a) { var li = el('li'); setKind(li, a.k); li.appendChild(icon(a.k)); li.appendChild(el('span', '', actionText(a, L))); li.appendChild(el('time', '', hhmm(new Date(a.t).toISOString()))); feed.appendChild(li); });
      body.appendChild(feed);
      var edited = {}, read = {};
      s.actions.forEach(function (a) { if (!a.x) return; if (a.k === 'edit') edited[a.x] = (edited[a.x] || 0) + 1; if (a.k === 'read') read[a.x] = (read[a.x] || 0) + 1; });
      var eN = Object.keys(edited), rN = Object.keys(read).filter(function (f) { return !edited[f]; });
      if (eN.length || rN.length) {
        var files = el('div', 'files');
        files.appendChild(el('div', 'panel-h', L.files + ' · ' + (eN.length + rN.length)));
        eN.forEach(function (f) { var r = el('div', 'file edited'); r.appendChild(icon('edit')); r.appendChild(el('span', '', f)); r.appendChild(el('em', '', L.changed + (edited[f] > 1 ? ' ×' + edited[f] : ''))); files.appendChild(r); });
        rN.forEach(function (f) { var r = el('div', 'file'); r.appendChild(icon('read')); r.appendChild(el('span', '', f)); r.appendChild(el('em', '', L.readOnly)); files.appendChild(r); });
        body.appendChild(files);
      }
    }
    var helpers = list.filter(function (x) { return x.parent === s.id; });
    if (helpers.length) { body.appendChild(el('div', 'panel-h', L.helpers + ' · ' + helpers.length)); body.appendChild(sessionRows(helpers, L)); }
    if (s.report) { var rep = el('div', 'report'); rep.appendChild(el('div', 'panel-h', L.report)); var rb = el('div', 'report-body', s.report.text); rb.classList.add('open'); rep.appendChild(rb); body.appendChild(rep); }
    return body;
  }
  function sheetAgent(box, d, L, agent, now) {
    var list = lastList;
    var st = agentStats(agent, list, now);
    var on = st.running.length > 0;
    sheetHead(box, L, { agent: agent, title: roleName(agent, L), meta: [L.names[role(agent)] ? el('span', '', roleTitle(agent, L)) : null, isTeam(agent) ? null : el('span', 'tag none', L.helper), el('span', 'state' + (on ? '' : ' off'), on ? L.working : L.idleAgent)] });
    sheetSec(box, L.whatDoes, roleDesc(agent, L, d));
    kv(box, [[L.runsToday, String(st.todayRuns)], [L.actionsToday, String(st.todayActs)], [L.timeToday, fmtMin(st.todayMin)], [L.lastSeen, st.runs[0] ? hhmm(new Date(st.runs[0].end || st.runs[0].start).toISOString()) : L.neverRan]]);
    var runs = st.runs.slice(0, 25);

        t.appendChild(el('span', '', hhmm(new Date(s.start).toISOString()) + (s.end ? ' – ' + hhmm(new Date(s.end).toISOString()) : '') + ' · ' + s.actions.length + ' ' + (s.actions.length === 1 ? L.action : L.actions)));
        sum.appendChild(t);

  var lastLive = [], lastActions = [], lastList = [];
  window.addEventListener('resize', function () { if (lastEdges) drawEdges($('flow'), lastEdges); });
  var edgeTimer = null;
  window.addEventListener('scroll', function () { clearTimeout(edgeTimer); edgeTimer = setTimeout(function () { if (lastEdges) drawEdges($('flow'), lastEdges); }, 120); }, { passive: true });

  function render(d, live, actions) {

    var list = sessions(live, actions);

    var running = list.filter(function (s) { return !s.end; });

    var stale = !running.length && d.now && d.updated && now - ms(d.updated) > STALE_MS && lastEventMs < ms(d.updated);
    renderTop(d, L, running.length, stale);
    renderKpis(d, L, running.length);
    renderTimeline(list, L, now);
    renderCrew(d, L);
    renderTickets(d, L);
    renderSecurity(d, L);
    renderDesign(d, L);
    renderMarketing(d, L);
    renderArchive(d, L);
    renderBoard(d, L);
    renderIdeasLive(d, L);
    renderIdeas(d, L);
    renderSecurityTab(d, L);

  }

  function tick() {
    var now = Date.now();
    var nodes = document.querySelectorAll('[data-since]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = dur(Number(nodes[i].getAttribute('data-since')), now);
  }

  function loadScript(name, done, fixedId) {
    var id = fixedId || 'src-' + name.replace('.', '-');
    var old = document.getElementById(id);
    if (old) old.parentNode.removeChild(old);
    var s = document.createElement('script');
    s.id = id;
    s.src = name + '?t=' + Date.now();
    s.onload = s.onerror = function () { done(); };
    document.body.appendChild(s);
  }

  function load() {
    window.TEAM_STATUS = undefined; window.TEAM_LIVE = undefined; window.TEAM_ACTIONS = undefined;
    loadScript('status.js', function () {
      loadScript('live.js', function () {
        loadScript('actions.js', function () {

          var actions = Array.isArray(window.TEAM_ACTIONS) ? window.TEAM_ACTIONS : [];
          $('nodata').hidden = !!window.TEAM_STATUS || live.length > 0 || actions.length > 0;
          if (tlRange === '30m') { render(d, live, actions); return; }

          loadScript('history.js', function () {
            history = Array.isArray(window.TEAM_HISTORY) ? window.TEAM_HISTORY : [];

        });

    });
  }

  $('tab-live').addEventListener('click', function () { showView('live'); });

  $('tab-board').addEventListener('click', function () { showView('board'); });
  $('tab-agents').addEventListener('click', function () { showView('agents'); });
  $('tab-security').addEventListener('click', function () { showView('security'); });
  $('tab-ideas').addEventListener('click', function () { showView('ideas'); });
  $('sec-search').addEventListener('input', function (e) { secQuery = e.target.value; if (lastData) renderSecurityTab(lastData, labels(lastData)); });
  $('idea-search').addEventListener('input', function (e) { ideaQuery = e.target.value; if (lastData) renderIdeas(lastData, labels(lastData)); });
  $('sheet-bg').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheetRef) { e.preventDefault(); closeSheet(); return; }
    if (e.key === 'Tab' && sheetRef) {
      // keep keyboard focus inside the open sheet
      var f = $('sheet').querySelectorAll('button, a[href], summary, [tabindex="0"]');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      else if (!$('sheet').contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    }
  });
  $('sec-search-icon').replaceWith(icon('search'));
  $('idea-search-icon').replaceWith(icon('search'));
  $('search').addEventListener('input', function () { if (lastData) renderArchive(lastData, labels(lastData)); });
  showView(view);
  load();
  setInterval(load, REFRESH_MS);
  setInterval(tick, 1000);
})();
