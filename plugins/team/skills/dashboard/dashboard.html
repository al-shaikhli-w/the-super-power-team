<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f9fafb; --text: #0f172a; --text-2: #475569; --text-3: #94a3b8;
  --line: #e5e7eb; --line-2: #eef0f3; --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 1px 1px rgba(15, 23, 42, .03);
  --accent: #2563eb; --accent-soft: #eff4ff; --ok: #059669; --ok-soft: #ecfdf5; --bad: #dc2626; --bad-soft: #fef2f2;
  --warn: #b45309; --warn-soft: #fffbeb;
  --r-pm: #7c3aed; --r-rs: #0d9488; --r-pj: #d97706; --r-dl: #2563eb; --r-qa: #e11d48; --r-rw: #475569; --r-am: #64748b; --r-rv: #0891b2; --r-se: #b45309; --r-sm: #db2777;
  --r-x1: #0891b2; --r-x2: #c026d3; --r-x3: #65a30d; --r-x4: #ea580c; --r-x5: #4f46e5;
  --k-read: #64748b; --k-edit: #2563eb; --k-run: #7c3aed; --k-search: #0d9488; --k-web: #d97706; --k-tracker: #db2777; --k-tool: #94a3b8;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0d12; --surface: #12151c; --surface-2: #161a22; --text: #e8ebf1; --text-2: #a3acbd; --text-3: #6b7486;
    --line: #232834; --line-2: #1b1f29; --shadow: none;
    --accent: #6d9bff; --accent-soft: #172341; --ok: #34d399; --ok-soft: #0f2a21; --bad: #f87171; --bad-soft: #2c1517;
    --warn: #fbbf24; --warn-soft: #2b2110;
    --r-pm: #a78bfa; --r-rs: #2dd4bf; --r-pj: #fbbf24; --r-dl: #6d9bff; --r-qa: #fb7185; --r-rw: #94a3b8; --r-am: #8a94a6; --r-rv: #22d3ee; --r-se: #f59e0b; --r-sm: #f472b6;
    --r-x1: #22d3ee; --r-x2: #e879f9; --r-x3: #a3e635; --r-x4: #fb923c; --r-x5: #818cf8;
    --k-read: #94a3b8; --k-edit: #6d9bff; --k-run: #a78bfa; --k-search: #2dd4bf; --k-web: #fbbf24; --k-tracker: #f472b6; --k-tool: #6b7486;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable", "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Sans", sans-serif;
  -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01", "tnum";
}
/* Right-to-left (Arabic, Hebrew, Persian, Urdu): a font with the script first, room for
   diacritics, and no tracking — letter-spacing breaks the joins of connected scripts. */
:root[dir="rtl"] body {
  font-family: "SF Arabic", "Geeza Pro", "Noto Sans Arabic", "Segoe UI", Tahoma, "Noto Sans Hebrew", system-ui, sans-serif;
  line-height: 1.65; font-feature-settings: "tnum";
}
:root[dir="rtl"] *, :root[dir="rtl"] *::before, :root[dir="rtl"] *::after { letter-spacing: normal !important; font-style: normal; }
:root[dir="rtl"] .title b, :root[dir="rtl"] .section-head h2 { line-height: 1.4; }
:root[dir="rtl"] .tl-label { direction: rtl; }
:root[dir="rtl"] .flow { direction: rtl; }
/* Mixed text (English labels, ticket ids, times inside Arabic): each piece takes its direction
   from its own first letter, so "30 min" or "RB-7" never flip to "min 30" or "7-RB". */
:root[dir="rtl"] :is(button, a, b, i, span, small, label, td, th, li, p, h2, h3, h4, summary, option) { unicode-bidi: plaintext; }
:root[dir="rtl"] code, :root[dir="rtl"] pre, :root[dir="rtl"] .file span { direction: ltr; unicode-bidi: isolate; }
bdi, .ltr { unicode-bidi: isolate; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 56px; }
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin-bottom: 24px; }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-top: 14px; padding-bottom: 14px; }
.logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent); }
.logo svg { width: 17px; height: 17px; }
.title { display: flex; flex-direction: column; min-width: 0; }
.title b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title span { font-size: 12px; color: var(--text-3); }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 600; color: var(--text-2); white-space: nowrap; }
.pill .led { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.pill.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, var(--line)); background: var(--ok-soft); }
.pill.on .led { background: var(--ok); animation: ping 1.8s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 80%, 100% { box-shadow: 0 0 0 7px transparent; } }
.muted { color: var(--text-3); font-size: 12px; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 13px; font-weight: 500; margin-bottom: 20px; border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 28px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi .label { font-size: 12px; color: var(--text-2); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.kpi .label svg { width: 14px; height: 14px; color: var(--text-3); }
.kpi .value { font-size: 28px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; }
.kpi .value small { font-size: 15px; color: var(--text-3); font-weight: 500; margin-inline-start: 4px; }
.kpi .sub { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 3px; background: var(--ok); transition: width .6s ease; }

.section { margin-bottom: 28px; }
.section-head { display: flex; align-items: baseline; gap: 10px; margin: 0 2px 12px; }
.section-head h2 { font-size: 13px; font-weight: 650; margin: 0; letter-spacing: -.005em; }
.section-head .count { font-size: 12px; color: var(--text-3); font-weight: 500; }

.avatar { width: 38px; height: 38px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 700; letter-spacing: .02em; color: var(--role); background: color-mix(in srgb, var(--role) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--role) 22%, transparent); }
.agent-name { font-weight: 650; font-size: 14px; }
.agent-role { font-weight: 500; color: var(--text-3); font-size: 13px; }
.agent-meta { font-size: 12px; color: var(--text-3); display: flex; gap: 8px; align-items: center; }
.state { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--ok); }
.state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: ping 1.8s ease-out infinite; }
.state.off { color: var(--text-3); }
.state.off::before { animation: none; }
.timer { margin-inline-start: auto; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; color: var(--text-2); }
.task { font-size: 13px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 12px; }
.task b { display: block; font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
.doing { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 550; min-width: 0; }
.doing .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; color: var(--k); background: color-mix(in srgb, var(--k) 12%, var(--surface)); }
.doing .ico svg { width: 15px; height: 15px; }
.doing span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--text-2); font-variant-numeric: tabular-nums; }
.chip i { width: 7px; height: 7px; border-radius: 2px; background: var(--k); }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--line); padding-top: 12px; }
.feed li { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; font-size: 12px; color: var(--text-2); min-width: 0; }
.feed li svg { width: 13px; height: 13px; color: var(--k); }
.feed li span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed time { color: var(--text-3); font-variant-numeric: tabular-nums; }

.timeline { padding: 18px 18px 14px; }
.tl { direction: ltr; display: grid; grid-template-columns: 150px 1fr; row-gap: 10px; align-items: center; }
.tl-label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text-2); min-width: 0; }
.tl-label i { width: 8px; height: 8px; border-radius: 50%; background: var(--role); flex: none; }
.tl-label span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-track { position: relative; height: 22px; border-radius: 6px; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 6 - 1px), var(--line-2) calc(100% / 6 - 1px), var(--line-2) calc(100% / 6)); background-color: var(--surface-2); }
.tl-bar { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; background: color-mix(in srgb, var(--role) 22%, transparent); border: 1px solid color-mix(in srgb, var(--role) 45%, transparent); min-width: 4px; }
.tl-bar.running { background: color-mix(in srgb, var(--role) 32%, transparent); border-color: var(--role); }
.tl-dot { position: absolute; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: var(--k); }
.tl-now { position: absolute; top: -4px; bottom: -4px; right: 0; width: 2px; background: var(--ok); border-radius: 1px; }
.tl-axis { grid-column: 2; display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; padding-top: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-2); font-size: 12px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--k); }

.board { padding: 0; overflow: hidden; }
.grp-h { display: flex; align-items: center; gap: 8px; padding: 10px 18px; background: var(--surface-2); border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
.board > .grp-h:first-child { border-top: 0; }
.grp-h i { font-style: normal; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--line); color: var(--text-2); display: inline-grid; place-items: center; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.ticket { padding: 18px; }
.ticket + .ticket { border-top: 1px solid var(--line-2); }
.brows { list-style: none; margin: 0; padding: 0; }
.brows li { display: grid; grid-template-columns: 26px auto minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 11px 18px; border-top: 1px solid var(--line-2); }
.brows li:first-child { border-top: 0; }
.brows li:first-child .todo-n:not(.plan-n) { background: var(--accent); color: #fff; }
.tickets-tools { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
.brows-empty { padding: 14px 18px; font-size: 13px; color: var(--text-3); }
.brows li:hover { background: var(--surface-2); }
.plan-n { background: transparent; border: 1px dashed var(--line); }
.next-pill.status-next { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--accent-soft); }
.next-pill.status-busy { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); background: var(--ok-soft); }
.ticket-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; min-width: 0; }
.tid { font: 600 11px/1 ui-monospace, SFMono-Regular, Consolas, monospace; padding: 4px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); flex: none; }
.ttitle { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tpr { margin-inline-start: auto; font-size: 12px; font-weight: 600; color: var(--text-2); flex: none; }
.stepper { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.st { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; text-align: center; min-width: 0; }
.st::before { content: ""; position: absolute; top: 12px; inset-inline-start: calc(-50% + 16px); inset-inline-end: calc(50% + 16px); height: 2px; background: var(--line); }
.st:first-child::before { display: none; }
.st.done::before, .st.current::before, .st.fail::before { background: var(--ok); }
.node { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); background: var(--surface); color: var(--text-3); position: relative; z-index: 1; }
.node svg { width: 13px; height: 13px; }
.st.done .node { background: var(--ok); border-color: var(--ok); color: #fff; }
.st.current .node { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.st.current .node::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.st.fail .node { background: var(--bad); border-color: var(--bad); color: #fff; }
.st-name { font-size: 12px; font-weight: 600; color: var(--text-2); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st.todo .st-name { color: var(--text-3); font-weight: 500; }
.st.current .st-name { color: var(--accent); }
.st.fail .st-name { color: var(--bad); }
.st-sub { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; margin-top: -4px; }
.wait { margin-top: 18px; display: flex; gap: 10px; align-items: center; font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--text-2); }
.wait svg { width: 15px; height: 15px; color: var(--warn); flex: none; }
.wait b { color: var(--text); font-weight: 600; }

.none { padding: 22px; color: var(--text-3); font-size: 13px; text-align: center; }
footer { margin-top: 36px; display: flex; justify-content: center; gap: 8px; color: var(--text-3); font-size: 12px; }

@media (prefers-reduced-motion: reduce) { .pill.on .led, .state::before { animation: none; } .meter > i { transition: none; } }
@media (max-width: 920px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) {
  .wrap { padding-left: 16px; padding-right: 16px; }
  .kpis { gap: 10px; } .kpi { padding: 14px; } .kpi .value { font-size: 24px; }
  .tl { grid-template-columns: 96px 1fr; }
  .stepper { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 16px; }
  .st:nth-child(4)::before { display: none; }
  .top .muted { display: none; }
}
.tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--line-2); border: 1px solid var(--line); }
.tab { appearance: none; border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 13px; font-weight: 600; height: 28px; padding: 0 14px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(15, 23, 42, .08); }
.tab:focus-visible, .search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--line); color: var(--text-2); font-size: 11px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.toolbar { display: flex; align-items: center; gap: 12px; margin: 0 2px 12px; flex-wrap: wrap; }
.toolbar h2 { font-size: 13px; font-weight: 650; margin: 0; }
.search { margin-inline-start: auto; position: relative; }
.search svg { position: absolute; top: 50%; inset-inline-start: 10px; width: 14px; height: 14px; margin-top: -7px; color: var(--text-3); pointer-events: none; }
.search input { height: 34px; width: 260px; max-width: 100%; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; padding-inline: 32px 12px; }
.filters { display: inline-flex; gap: 6px; }
.filter { appearance: none; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
.filter[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: start; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 13px 16px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: var(--surface-2); }
.table .num { font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
.table .t-title { font-weight: 600; }
.table .t-sum { display: block; font-size: 12px; color: var(--text-3); font-weight: 400; margin-top: 2px; }
.res { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.res::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.res.merged { color: var(--ok); background: var(--ok-soft); }
.res.closed { color: var(--text-2); background: var(--line-2); }
.res.other { color: var(--warn); background: var(--warn-soft); }
.board-tools { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
.kcol { background: var(--line-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.kcol-h { display: flex; align-items: center; gap: 8px; padding: 4px 4px 6px; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
.kcol-h::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--kc, var(--text-3)); }
.kcol-h i { font-style: normal; margin-inline-start: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--surface); color: var(--text-2); display: inline-grid; place-items: center; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.kcol.plan { --kc: var(--text-3); } .kcol.do { --kc: var(--accent); } .kcol.check { --kc: var(--warn); } .kcol.done { --kc: var(--ok); }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.kcard.waiting { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.kcard-top { display: flex; align-items: center; gap: 8px; }

          var live = Array.isArray(window.TEAM_LIVE) ? window.TEAM_LIVE : [];
          var actions = Array.isArray(window.TEAM_ACTIONS) ? window.TEAM_ACTIONS : [];
          $('nodata').hidden = !!window.TEAM_STATUS || live.length > 0 || actions.length > 0;
          if (tlRange === '30m') { render(d, live, actions); return; }
          window.TEAM_HISTORY = undefined;
          loadScript('history.js', function () {
            history = Array.isArray(window.TEAM_HISTORY) ? window.TEAM_HISTORY : [];
            render(d, live, actions);
            if (tlRange === 'all' && historyAll === null) loadAll();
          });
        });
      });
    });
  }

  $('tab-live').addEventListener('click', function () { showView('live'); });
  $('tab-archive').addEventListener('click', function () { showView('archive'); });
  $('tab-board').addEventListener('click', function () { showView('board'); });
  $('search').addEventListener('input', function () { if (lastData) renderArchive(lastData, labels(lastData)); });
  showView(view);
  load();
  setInterval(load, REFRESH_MS);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
